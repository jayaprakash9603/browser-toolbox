name: Build extension release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: browser-toolbox

jobs:
  package:
    name: Validate and package browser targets
    runs-on: ubuntu-latest
    steps:
      - name: Check out browser toolbox
        uses: actions/checkout@v4
        with:
          path: browser-toolbox

      - name: Check out Postman Lite dependency
        uses: actions/checkout@v4
        with:
          repository: jayaprakash9603/Postman-Lite
          path: postman-lite

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            browser-toolbox/package-lock.json
            postman-lite/package-lock.json

      - name: Install and build Postman Lite
        run: npm ci && npm run build:lib
        working-directory: postman-lite

      - name: Install browser toolbox dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Build Chromium and Firefox targets
        run: npm run build:all

      - name: Validate target manifests
        run: npm run validate:targets

      - name: Validate Firefox package
        run: npm run lint:firefox

      - name: Package all browser artifacts
        run: npm run package:all

      - name: Read release version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify pushed tag version
        if: github.event_name == 'push'
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v${{ steps.version.outputs.version }}"

      - name: Upload release bundle as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-toolbox-v${{ steps.version.outputs.version }}
          path: browser-toolbox/releases/v${{ steps.version.outputs.version }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: One Panel v${{ steps.version.outputs.version }}
          body_path: browser-toolbox/releases/v${{ steps.version.outputs.version }}/one-panel-v${{ steps.version.outputs.version }}-notes.txt
          files: |
            browser-toolbox/releases/v${{ steps.version.outputs.version }}/*.zip
            browser-toolbox/releases/v${{ steps.version.outputs.version }}/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

