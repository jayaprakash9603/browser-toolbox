<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon32.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/icons/icon128.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/theme-boot.js"></script>
    <title>One Panel</title>
    <style>
      #boot-shell {
        box-sizing: border-box;
        display: flex;
        height: 100vh;
        flex-direction: column;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
        background: #fafafa;
        color: #0a0a0a;
      }
      html.dark #boot-shell {
        background: #0a0a0a;
        color: #fafafa;
      }
      #boot-shell header {
        display: flex;
        height: 52px;
        flex-shrink: 0;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        padding: 0 12px;
      }
      html.dark #boot-shell header {
        border-bottom-color: rgba(255, 255, 255, 0.1);
      }
      #boot-shell .shimmer {
        border-radius: 8px;
        background: linear-gradient(90deg, rgba(0, 0, 0, 0.06) 0%, rgba(0, 0, 0, 0.1) 50%, rgba(0, 0, 0, 0.06) 100%);
        background-size: 200% 100%;
        animation: boot-shimmer 1.2s ease-in-out infinite;
      }
      html.dark #boot-shell .shimmer {
        background: linear-gradient(90deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.12) 50%, rgba(255, 255, 255, 0.06) 100%);
        background-size: 200% 100%;
      }
      @keyframes boot-shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
      #boot-shell main {
        flex: 1;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell" aria-hidden="true">
        <header>
          <div class="shimmer" style="width: 30px; height: 30px; border-radius: 6px"></div>
          <div class="shimmer" style="width: 120px; height: 14px"></div>
        </header>
        <main>
          <div class="shimmer" style="height: 72px"></div>
          <div class="shimmer" style="height: 120px"></div>
          <div class="shimmer" style="flex: 1; min-height: 80px"></div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
